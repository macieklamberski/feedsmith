name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release
        required: true
        default: main
        type: choice
        options:
          - main
          - hotfix
          - 2.x
          - rc
          - beta
          - alpha

jobs:
  test:
    uses: macieklamberski/kvalita/.github/workflows/shared-test.yml@main
    with:
      ref: ${{ inputs.branch }}
    secrets: inherit

  package:
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.branch }}

  release:
    needs: [test, package]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: macieklamberski/kvalita/.github/workflows/shared-release.yml@main
    with:
      branch: ${{ inputs.branch }}
      build: true
    secrets: inherit
