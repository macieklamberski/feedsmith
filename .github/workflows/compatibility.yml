name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test. Defaults to the ref that triggered the workflow.
        required: false
        type: string
        default: ''

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: bun run build

      - name: Install compatibility test dependencies
        working-directory: compatibility
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run compatibility tests
        working-directory: compatibility
        run: ./test.sh
