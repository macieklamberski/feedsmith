version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

updates:
  - package-ecosystem: bun
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories:
      - /**/*
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
